<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Órdenes - Taller El Milagro</title>
    <link rel="stylesheet" href="estilos.css">
    
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Historial de Órdenes</h1>
            <a href="index.html" class="btn-navegacion">← Volver al Registro</a>
        </div>
        <div style="text-align: right; padding: 10px;">
    <button onclick="cerrarSesion()" class="btn-salir">
        🚪 Cerrar Sesión
    </button>
</div>
    </header>

    <section>
        <div id="estadisticas" style="display: flex; gap: 20px; margin-bottom: 25px;">
            <div style="background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; flex: 1; text-align: center;">
                <p style="margin: 0; color: #8b949e; font-size: 0.9em;">En Proceso 🛠️</p>
                <h2 id="total-abiertos" style="margin: 5px 0; color: #58a6ff;">0</h2>
            </div>
            <div style="background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; flex: 1; text-align: center;">
                <p style="margin: 0; color: #8b949e; font-size: 0.9em;">Terminados ✅</p>
                <h2 id="total-cerrados" style="margin: 5px 0; color: #238636;">0</h2>
            </div>
        </div>

        <div class="buscador-container" style="margin-bottom: 20px;">
            <input type="text" id="buscador" placeholder="Buscar por placa o nombre del cliente..." style="width: 100%; max-width: 500px;">
        </div>

        <h2>Últimas 5 Órdenes</h2>
        <div id="contenedor-recientes"></div>

        <hr style="border: 1px solid #30363d; margin: 30px 0;">

        <h2>Resultados de Búsqueda</h2>
        <div id="contenedor-busqueda"></div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script-ordenes.js"></script>
</body>
</html>
